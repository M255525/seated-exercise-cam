<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>坐姿健康操：坐著跟著做，鏡頭幫你數</title>
<meta name="description" content="給長輩的坐姿健康操：坐在椅子上跟著示範做雙手舉高、擴胸、聳肩、側彎、拍手、坐著踏步，攝影機幫你數次數，也可以不開鏡頭跟著語音節拍做。影像只在這台裝置分析，不錄影不上傳。">
<meta name="theme-color" content="#2f6b3f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#fff4d6; --sun:#ffb627; --leaf:#2f6b3f; --leaf2:#4f9a5c; --grass:#dff0cf; --card:#fffdf6; --ink:#24301f; --sub:#5d6a55; --line:#e4dcc2;
  --red:#d9472b; --blue:#2e6fb3; --mq:0px; color-scheme:light;
}
html{font-size:20px;-webkit-text-size-adjust:100%}
html[data-fs="xl"]{font-size:24px}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;color:var(--ink);font-family:'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif;font-weight:700;line-height:1.55;padding-top:var(--mq);
  background:radial-gradient(circle at 85% -5%,#ffe08a 0 9rem,transparent 9.1rem),linear-gradient(180deg,var(--sky) 0%,#fff9e8 55%,var(--grass) 100%) fixed}
body.has-marquee{--mq:34px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
h1,h2,h3{margin:0;line-height:1.3;font-weight:900}
#marqueeBar{position:fixed;top:0;left:0;right:0;height:34px;background:var(--leaf);color:#fff6c8;z-index:60;overflow:hidden;display:none;align-items:center;font-size:15px}
#marqueeBar.show{display:flex}
#marqueeTrack{display:inline-block;white-space:nowrap;padding-left:100%;animation:mq 30s linear infinite}
#marqueeBar:hover #marqueeTrack{animation-play-state:paused}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}

#app{max-width:64rem;margin:0 auto;padding:.7rem 1rem calc(1.5rem + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.top h1{flex:1 1 12rem;font-size:1.35rem;display:flex;align-items:center;gap:.4rem;color:var(--leaf)}
.ibtn{min-height:2.6rem;padding:0 .8rem;border:2px solid var(--line);border-radius:.8rem;background:var(--card);font-weight:900;font-size:.85rem;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:.3rem}
.warn-line{margin:.3rem 0 0;font-size:.72rem;color:var(--sub);font-weight:700}
.warn-line button{background:none;border:0;padding:0;color:var(--red);text-decoration:underline;font-weight:900;font-size:inherit}
.card{background:var(--card);border-radius:1.2rem;box-shadow:0 2px 0 var(--line),0 10px 24px rgba(60,80,40,.1);padding:1rem 1.2rem;margin-top:.9rem}
.lead{color:var(--sub);margin:.3rem 0 0;font-weight:700}
.small{font-size:.78rem;color:var(--sub);font-weight:700}
.big{display:flex;align-items:center;justify-content:center;gap:.6rem;width:100%;min-height:4.4rem;border:0;border-radius:1.2rem;font-size:1.35rem;font-weight:900;color:#fff;background:var(--leaf);box-shadow:0 5px 0 #1d4a28;margin-top:.8rem;text-decoration:none;text-align:center;padding:.4rem 1rem}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #1d4a28}
.big.sun{background:var(--sun);color:#3a2a00;box-shadow:0 5px 0 #b37800}
.big.alt{background:var(--card);color:var(--ink);box-shadow:0 0 0 3px var(--line),0 5px 0 var(--line)}
.big.red{background:var(--red);box-shadow:0 5px 0 #8c2a17}
.big small{display:block;font-size:.72rem;font-weight:700;opacity:.9}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,14rem),1fr));gap:.8rem}
.row .big{margin-top:0}

/* 首頁 */
.hello{display:grid;grid-template-columns:minmax(0,1fr) 13rem;gap:1rem;align-items:center}
@media (max-width:640px){.hello{grid-template-columns:1fr}.hello .fig{max-width:12rem;margin:0 auto}}
.hello h2{font-size:clamp(1.6rem,4.6vw,2.3rem)}
.stamp{display:inline-flex;align-items:center;justify-content:center;width:5rem;height:5rem;border-radius:50%;border:4px solid var(--red);color:var(--red);font-weight:900;font-size:1rem;transform:rotate(-12deg);background:rgba(255,255,255,.7);text-align:center;line-height:1.2}
.today{display:flex;align-items:center;gap:1rem;margin-top:.6rem;flex-wrap:wrap}
/* 課程 */
.course{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.2rem .8rem;align-items:center;text-align:left;width:100%;border:3px solid var(--line);background:var(--card);border-radius:1.1rem;padding:.8rem 1rem;margin-top:.7rem;min-height:5rem}
.course .ic{font-size:2.2rem;grid-row:1/3}
.course b{font-size:1.2rem}
.course span{font-size:.8rem;color:var(--sub)}
.course[aria-pressed="true"],.course:hover{border-color:var(--leaf);background:#f2fbea}
.mv{display:flex;align-items:center;gap:.6rem;border:2px solid var(--line);border-radius:.9rem;padding:.5rem .7rem;margin-top:.5rem;background:var(--card)}
.mv label{flex:1 1 auto;display:flex;align-items:center;gap:.5rem;font-size:1rem}
.mv input[type=checkbox]{width:1.6rem;height:1.6rem}
.mv select{min-height:2.6rem;border:2px solid var(--line);border-radius:.6rem;padding:0 .4rem;background:#fff}
/* 準備 */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,15rem),1fr));gap:.8rem;margin-top:.8rem}
.mode{border:3px solid var(--line);background:var(--card);border-radius:1.1rem;padding:.9rem 1rem;text-align:left;min-height:7rem}
.mode b{display:block;font-size:1.2rem}
.mode span{font-size:.8rem;color:var(--sub)}
.mode[aria-pressed="true"]{border-color:var(--leaf);background:#f2fbea;box-shadow:0 0 0 3px var(--leaf2)}
.checks{display:grid;gap:.4rem;margin-top:.6rem;font-size:.95rem}
.checks div::before{margin-right:.4rem}
.checks .y::before{content:'✅'}.checks .n::before{content:'⬜'}
/* 運動中 */
.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.9rem;margin-top:.8rem;align-items:start}
@media (max-width:760px){.stage{grid-template-columns:1fr}}
.pane{background:var(--card);border-radius:1.2rem;box-shadow:0 10px 24px rgba(60,80,40,.12);overflow:hidden;position:relative}
.pane .hd{padding:.6rem .9rem;background:var(--leaf);color:#fff;display:flex;align-items:center;gap:.5rem}
.pane .hd b{font-size:1.4rem;flex:1}
.pane .hd span{font-size:.8rem;opacity:.9}
.figbox{position:relative;aspect-ratio:4/3;background:linear-gradient(180deg,#fff7e0,#eef7e3)}
.figbox canvas{display:block;width:100%;height:100%}
.howto{padding:.6rem .9rem .8rem;font-size:1.05rem}
.howto .small{display:block;margin-top:.2rem}
.cambox{position:relative;aspect-ratio:4/3;background:#1d2a1a}
.cambox video,.cambox canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cambox canvas{pointer-events:none}
.counter{position:absolute;right:.6rem;top:.6rem;background:rgba(255,253,246,.92);border-radius:1rem;padding:.2rem .9rem;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.counter b{display:block;font-size:3.2rem;line-height:1.05;color:var(--leaf);font-variant-numeric:tabular-nums}
.counter span{font-size:.8rem;color:var(--sub)}
.counter.pop b{animation:pop .35s ease-out}
@keyframes pop{40%{transform:scale(1.35);color:var(--sun)}}
.camhint{position:absolute;left:.6rem;right:.6rem;bottom:.6rem;background:rgba(36,48,31,.82);color:#fff;border-radius:.8rem;padding:.4rem .7rem;font-size:1rem;text-align:center}
.beat{display:flex;flex-direction:column;align-items:center;justify-content:center;aspect-ratio:4/3;background:linear-gradient(180deg,#fff7e0,#eef7e3)}
.beat b{font-size:6rem;line-height:1;color:var(--leaf);font-variant-numeric:tabular-nums}
.beat span{font-size:1.1rem;color:var(--sub)}
.ring{width:9rem;height:.8rem;border-radius:1rem;background:#e6eadb;overflow:hidden;margin-top:.8rem}
.ring i{display:block;height:100%;background:var(--sun);width:0}
.dots{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.6rem;justify-content:center}
.dots i{width:1.1rem;height:1.1rem;border-radius:50%;background:#e2e6d4;display:block}
.dots i.done{background:var(--leaf2)}.dots i.cur{background:var(--sun);box-shadow:0 0 0 3px #fff,0 0 0 5px var(--sun)}
.ctl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.6rem;margin-top:.8rem}
.ctl .big{margin-top:0;min-height:3.6rem;font-size:1.05rem}
@media (max-width:560px){.ctl{grid-template-columns:repeat(2,minmax(0,1fr))}}
.overlay{position:fixed;inset:0;background:rgba(255,249,232,.94);z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:1rem}
.overlay h2{font-size:clamp(1.8rem,6vw,3rem);color:var(--leaf)}
.overlay .cd{font-size:6rem;font-weight:900;color:var(--sun);line-height:1}
.overlay p{font-size:1.2rem;max-width:30rem}
.overlay .big{max-width:22rem}
.stall{margin-top:.6rem;border-radius:.9rem;padding:.6rem .9rem;background:#fff1c9;color:#6b4a00;font-size:.95rem}
/* 紀錄 */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.35rem;margin-top:.6rem}
.cal div{aspect-ratio:1;border-radius:.6rem;background:#f2efe2;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.8rem;color:var(--sub)}
.cal div.on{background:#ffe0d6;color:var(--red)}
.cal div.on::after{content:'✓';font-size:1.2rem;font-weight:900}
.cal div.blank{background:none}
.cal .wd{background:none;aspect-ratio:auto;font-size:.75rem}
.stat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem;margin-top:.6rem;text-align:center}
.stat div{background:#f2fbea;border-radius:.9rem;padding:.5rem}
.stat b{display:block;font-size:1.8rem;color:var(--leaf)}
.stat span{font-size:.8rem;color:var(--sub)}

.foot{text-align:center;font-size:.72rem;color:var(--sub);margin-top:1.6rem}
.foot a{margin:0 .4rem}
#modal{position:fixed;inset:0;background:rgba(30,40,25,.55);z-index:80;display:none;align-items:center;justify-content:center;padding:1rem}
#modal.show{display:flex}
#modalBox{background:var(--card);width:100%;max-width:38rem;max-height:calc(100dvh - 2rem);overflow:auto;border-radius:1.2rem;padding:1rem 1.2rem;box-shadow:0 10px 40px rgba(0,0,0,.3);font-size:.9rem}
#modalBox h2{font-size:1.3rem;margin-bottom:.4rem}
#modalBox ul{margin:.3rem 0;padding-left:1.2em}
.set-sec{border-radius:.8rem;margin-bottom:.5rem;background:#f7f4e8;box-shadow:inset 0 0 0 2px var(--line)}
.set-sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:.5rem;padding:.6rem .8rem;min-height:3rem}
.set-sec>summary::-webkit-details-marker{display:none}
.set-sec>summary::after{content:'▸';transition:transform .2s}
.set-sec[open]>summary::after{transform:rotate(90deg)}
.set-sec .sst{flex:1 1 0}
.set-sec .ssv{font-size:.72rem;color:var(--sub)}
.set-body{padding:0 .8rem .8rem}
.seg{display:flex;flex-wrap:wrap;gap:.4rem}
.seg button{border:2px solid var(--line);background:#fff;border-radius:.7rem;padding:.3rem .8rem;min-height:2.7rem;font-weight:900}
.seg button[aria-pressed="true"]{background:var(--leaf);border-color:var(--leaf);color:#fff}
.sbtn{border:2px solid var(--line);background:#fff;border-radius:.7rem;padding:.3rem .8rem;min-height:2.7rem;font-weight:900}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:var(--leaf);color:#fff;padding:.6rem 1.1rem;border-radius:.9rem;z-index:90;font-weight:900;max-width:calc(100vw - 2rem)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="marqueeBar"><div id="marqueeTrack"></div></div>
<main id="app"></main>
<div id="modal" role="dialog" aria-modal="true"><div id="modalBox"></div></div>
<video id="cam" playsinline muted hidden></video>
<noscript>這個工具需要開啟 JavaScript 才能使用。</noscript>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
